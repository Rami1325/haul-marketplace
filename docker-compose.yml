services:
  postgres:
    # PostGIS is not optional — the whole dispatch layer is ST_DWithin.
    image: postgis/postgis:16-3.4
    container_name: haul-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: haul
      POSTGRES_PASSWORD: haul_dev
      POSTGRES_DB: haul
      # Israeli data: keep the DB in UTC, convert at the edge.
      TZ: UTC
      PGTZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - haul_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U haul -d haul']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    # Hot dispatch state: driver presence, live positions, offer countdowns.
    image: redis:7-alpine
    container_name: haul-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - haul_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  haul_pg:
  haul_redis:
